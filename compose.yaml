services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbital_signal
      POSTGRES_USER: orbital_signal
      POSTGRES_PASSWORD: orbital_signal
    ports:
    - "127.0.0.1:55432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U orbital_signal -d orbital_signal
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - orbital_signal_postgres_data:/var/lib/postgresql/data

volumes:
  orbital_signal_postgres_data: